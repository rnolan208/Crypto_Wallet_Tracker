<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Crypto Wallet Tracker
    </title>

</head>

<body>

    <h1>
        Crypto Wallet Tracker
    </h1>

    <label for="wallet-address">
        Ethereum Wallet Address
    </label>

    <input id="wallet-address" type="text" placeholder="0x...">

    <button id="track-wallet">Track Wallet</button>

    <p id="error-message"></p>

    <div id="wallet-results">
        <h2>Wallet Details</h2>

        <p>ETH Balance: <span id="eth-balance">--</span> ETH</p>

        <p>ETH Price: €<span id="eth-price">--</span></p>

        <p>Wallet Value: €<span id="wallet-value">--</span></p>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
