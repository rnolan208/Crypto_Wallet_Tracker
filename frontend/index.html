<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Crypto Wallet Tracker
    </title>

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <main class="app-container">

        <h1>
            Crypto Wallet Tracker
        </h1>

        <form class="wallet-form" id="wallet-form">
            <label for="wallet-address">
                Ethereum Wallet Address
            </label>

            <div class="input-group">
                <input id="wallet-address" type="text" placeholder="0x...">

                <button id="track-wallet">Track Wallet</button>
            </div>
        </form>

        <p id="error-message"></p>

        <div id="loading-spinner" class="spinner"></div>

        <div id="wallet-results">
            <h2>Wallet Details</h2>

            <p>ETH Balance: <span id="eth-balance">--</span> ETH</p>

            <p>ETH Price: €<span id="eth-price">--</span></p>

            <p>Wallet Value: €<span id="wallet-value">--</span></p>
        </div>

    </main>

    <script src="js/app.js"></script>
</body>

</html>
